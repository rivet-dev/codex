[package]
edition.workspace = true
license.workspace = true
name = "codex-utils-pty"
version.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "sync", "time"] }

[target.'cfg(not(target_os = "wasi"))'.dependencies]
portable-pty = { workspace = true }
tokio = { workspace = true, features = ["process", "rt-multi-thread"] }

# wasm32-wasip1: portable-pty + tokio process compile via the secure-exec toolchain
# patches (portable-pty wasi backend; tokio wasi process imp). No rt-multi-thread
# (wasip1 is single-threaded); the VM runs a current-thread runtime.
[target.'cfg(target_os = "wasi")'.dependencies]
portable-pty = { workspace = true }
tokio = { workspace = true, features = ["process"] }

[dev-dependencies]
pretty_assertions = { workspace = true }

[target.'cfg(windows)'.dependencies]
filedescriptor = "0.8.3"
lazy_static = { workspace = true }
log = { workspace = true }
shared_library = "0.1.9"
winapi = { version = "0.3.9", features = [
    "handleapi",
    "jobapi2",
    "minwinbase",
    "processthreadsapi",
    "synchapi",
    "winbase",
    "wincon",
    "winerror",
    "winnt",
] }
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[lib]
doctest = false
